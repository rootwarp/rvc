[package]
name = "rvc-signer-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Remote BLS signer server assembly (gRPC + Web3Signer HTTP)"

[lints]
workspace = true

[lib]
name = "signer_server"
path = "src/lib.rs"

[features]
default = []
# Enables PeerSignerService client stubs (DVT dial-out) via the shared proto crate.
dvt = ["vsss-rs", "bls12_381_plus", "rand", "signer-proto/client", "signer-registry/dvt"]

[dependencies]
async-trait.workspace = true
blst.workspace = true
clap.workspace = true
crypto.workspace = true
observability.workspace = true
eth-types.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
signer.workspace = true
signer-proto = { workspace = true, features = ["server", "client"] }
slashing.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tonic = { workspace = true, features = ["tls"] }
tree_hash.workspace = true
web3signer-wire.workspace = true
# rustls reached via the `tokio_rustls::rustls` re-export so the HTTP transport
# binds the same rustls as the gRPC/tonic stack (single CertificateDer type,
# enforced by 1.5's guard test). Pinned to the versions already in Cargo.lock.
#
# default-features = false is REQUIRED. The rustls `default` set enables the
# `aws_lc_rs` provider feature (and `prefer-post-quantum`, which also pulls it).
# Cargo unifies features across the workspace, so enabling `aws_lc_rs` here would
# turn on BOTH providers on the single shared rustls crate, making automatic
# provider detection ambiguous; `ServerConfig::builder()` would then panic in
# every gRPC mTLS path that builds without an installed default (verified while
# implementing: it broke rvc-grpc-signer integration + rvc-signer-bin dvt tests
# on a --workspace run). We instead match the workspace's existing backend
# (`ring`, pulled by rcgen/quinn/reqwest) and install the ring provider as the
# startup default (see `http_api::tls_config`). This keeps the shared rustls feature set
# identical to `develop` — zero graph perturbation, zero net-new crates (R1/R4).
# NOTE: deviates from ADR-006's named `aws_lc_rs` provider; see http_api/tls_config.rs.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
# tokio-rustls's default features ALSO enable `aws_lc_rs` (→ rustls/aws_lc_rs),
# so it gets the same default-features = false + `ring` treatment for the reason
# documented above; otherwise it re-introduces the second provider via unification.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
# Web3Signer HTTP API direct deps (R4 version-pinning). `axum` is pinned to "0.7"
# (NOT the transitive 0.8.8 in the lock) so the HTTP server binds the same
# rustls/pki-types as tonic; rustls is always reached via `tokio_rustls::rustls`
# (see http_api/mod.rs's compile-time guard).
axum = "0.7"
# `hyper` (http1 serve_connection) + `hyper-util` (TokioIo/TokioTimer) + `tower`
# (ServiceExt::oneshot) drive the accept loop. Already resolved in Cargo.lock.
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { workspace = true, features = ["util"] }
rustls-pemfile = "2"
prometheus.workspace = true
rvc-config.workspace = true
telemetry.workspace = true
# release_max_level_debug: trace! (and below-cap spans) compile to nothing in
# --release; debug! stays RUST_LOG-switchable. The `log` bridge feature is NOT
# enabled (it reintroduces cost under a static cap; ADR-001).
tracing = { workspace = true, features = ["release_max_level_debug"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zeroize.workspace = true

x509-parser.workspace = true

# DVT (optional)
vsss-rs = { workspace = true, optional = true }
bls12_381_plus = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
async-trait.workspace = true
hex.workspace = true
reqwest.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }
parking_lot.workspace = true
rvc-test-support.workspace = true
tempfile.workspace = true
# ARCH-5a load harness reads `rvc_signer_slashing_tx_hold_duration_ms`.
metrics.workspace = true
proptest.workspace = true
rand.workspace = true
tokio-stream.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-util.workspace = true
tonic = { workspace = true, features = ["tls"] }
tracing-test.workspace = true
grpc-signer.workspace = true
crypto = { workspace = true, features = ["test-utils"] }
eth-types = { workspace = true, features = ["test-fixtures"] }
slashing.workspace = true
zeroize.workspace = true
# Drives the axum Router in-memory (oneshot) for socket-free http_api tests.
tower = { workspace = true, features = ["util"] }
# The `client` hyper feature drives the real-TLS-client integration tests for
# the accept loop. Dev-only so production hyper stays server+http1.
hyper = { workspace = true, features = ["client"] }

# DVT test dependencies (always available in tests when dvt feature is on)
vsss-rs.workspace = true
bls12_381_plus.workspace = true

# M4 enumeration gate (SS-1) — dev-only; must NOT be a production edge
signer-registry.workspace = true
# KAT constants for plan-engine PTC signing-root tests. Dev-only; not a production edge.
rvc-spec-vectors = { workspace = true, features = ["test-fixtures"] }
