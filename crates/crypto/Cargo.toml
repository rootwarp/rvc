[package]
name = "rvc-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Exposes `test_utils` (create_test_keystore fixtures). Enable only from
# consumers' [dev-dependencies] — never on production dependency lines.
test-utils = []

[dependencies]
observability = { workspace = true }
aes.workspace = true
async-trait.workspace = true
blst.workspace = true
ctr.workspace = true
eth-types.workspace = true
hex.workspace = true
pbkdf2.workspace = true
rand.workspace = true
scrypt.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tracing.workspace = true
tree_hash.workspace = true
uuid.workspace = true
zeroize.workspace = true
hkdf.workspace = true
num-bigint.workspace = true
parking_lot.workspace = true
bip39.workspace = true
rayon.workspace = true

[dev-dependencies]
eth-types = { workspace = true, features = ["test-fixtures"] }
rvc-spec-vectors = { workspace = true, features = ["test-fixtures"] }
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tracing-subscriber.workspace = true
tracing-test.workspace = true
