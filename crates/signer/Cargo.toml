[package]
name = "rvc-signer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Exposes AlwaysEnabled / always_enabled() and StubValidatorSigner for
# cross-crate tests. Never enable in production binary dependency lines
# (SEC-2a Finding 2).
test-utils = []

[dependencies]
async-trait.workspace = true
crypto.workspace = true
observability.workspace = true
doppelganger.workspace = true
eth-types.workspace = true
hex.workspace = true
metrics.workspace = true
parking_lot.workspace = true
slashing.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
tree_hash.workspace = true

[dev-dependencies]
crypto.workspace = true
eth-types = { workspace = true, features = ["test-fixtures"] }
grpc-signer.workspace = true
prost.workspace = true
remote-signer-client.workspace = true
signer-server.workspace = true
tonic.workspace = true
tokio-stream.workspace = true
# Enables `slashing::fail_next_commits` for RF4-03 path-level CommitFailed tests.
slashing = { workspace = true, features = ["test-utils"] }
# Feature-unify `test-utils` onto the crate-under-test so integration tests
# can call `SlashableSignSession::for_tests`. Production dependents do not
# get this line.
rvc-signer = { path = ".", features = ["test-utils"] }
serde_json.workspace = true
tracing-subscriber = { workspace = true, features = ["registry", "fmt"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
criterion.workspace = true
rvc-spec-vectors = { workspace = true, features = ["test-fixtures"] }

# Latency-sanity companion to the Gate-4 zero-alloc test (issue 2.13). Run via
# `cargo bench`; NOT a blocking gate and NOT run under nextest/CI.
[[bench]]
name = "sign_path"
harness = false
