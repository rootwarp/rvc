[package]
name = "rvc-bn-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Beacon node manager with multi-BN support and failover"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rootwarp/rvc"
keywords = ["ethereum", "beacon", "validator", "failover"]
categories = ["cryptography::cryptocurrencies"]

[lints]
workspace = true

[features]
default = []
# Exposes MockBeaconNodeClient for cross-crate tests. Do not enable on
# production binary dependency lines.
test-utils = []

[dependencies]
beacon = { workspace = true }
observability = { workspace = true }
eth-types = { workspace = true }
metrics = { workspace = true }
async-trait = { workspace = true }
futures.workspace = true
# SSE framing is in-tree (`sse::frame`). Do not depend on reqwest-eventsource:
# it pulls eventsource-stream 0.2.3, which buffers without a cap and panics on
# a leading U+FEFF. 0.2.3 is the latest crates.io release.
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# Feature-unify `test-utils` so integration tests see SSE drop notifications.
rvc-bn-manager = { path = ".", features = ["test-utils"] }
eth-types = { workspace = true, features = ["test-fixtures"] }
serde_json = { workspace = true }
wiremock = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
tracing-subscriber = { workspace = true, features = ["registry"] }
# RR0-05: `tokio::time::pause` / `start_paused` for the mock request-delay test.
# `test-util` is not part of tokio's `full` feature.
tokio = { workspace = true, features = ["test-util"] }
