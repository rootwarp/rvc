[package]
name = "rvc-slashing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Test-only injects (e.g. fail-next-commit). Never enable on production
# dependency lines — only via consuming crates' [dev-dependencies].
test-utils = []

[dependencies]
observability.workspace = true
eth-types.workspace = true
hex.workspace = true
metrics.workspace = true
parking_lot.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
tracing-subscriber = { workspace = true, features = ["registry"] }
tracing-test = { workspace = true, features = ["no-env-filter"] }
metrics.workspace = true
# Feature-unify `test-utils` onto the crate-under-test so integration tests
# (`tests/reserve.rs`) can arm `fail_next_commits`. Production dependents
# do not get this line.
rvc-slashing = { path = ".", features = ["test-utils"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
