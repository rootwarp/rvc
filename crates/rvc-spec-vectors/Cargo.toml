[package]
name = "rvc-spec-vectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Spec vectors + KAT codegen"

[lints]
workspace = true

[features]
default = []
# Exposes Gloas/SPEC_* KAT constants to downstream test targets.
# Enable only from consumers' [dev-dependencies].
test-fixtures = []

[dependencies]
hex.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
snap.workspace = true
thiserror.workspace = true

[dev-dependencies]
libssz-merkle.workspace = true
tempfile.workspace = true

[[bin]]
name = "gen-spec-kat"
path = "src/bin/gen_spec_kat.rs"
