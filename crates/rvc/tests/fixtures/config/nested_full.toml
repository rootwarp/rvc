# ARCH-4d corpus: same knobs as flat_legacy_full.toml via the 7 nested tables.

[keymanager]
enabled = true
address = "10.0.0.8:5062"
token_file = "/var/lib/rvc/wire/km.token"
remote_signer_url = "https://wire-signer:9000"
remote_signer_allowed_hosts = ["wire.signer.example"]
allow_insecure_remote_signer = true
cors_origins = ["https://wire.cors.example"]
body_limit = 424242

[tracing]
endpoint = "http://wire-otel:4318"
exporter = "gcp"
sample_rate = 0.37
max_queue_size = 3333
max_export_batch_size = 444
service_name = "rvc-wire"

[grpc_signer]
url = "https://wire-grpc:50051"
tls_cert = "/etc/rvc/wire/client.crt"
tls_key = "/etc/rvc/wire/client.key"
tls_ca_cert = "/etc/rvc/wire/ca.crt"

[builder_limits]
circuit_breaker_consecutive_limit = 8
circuit_breaker_epoch_limit = 13

[monitoring]
endpoint = "https://wire.monitor/metrics"
interval = 96
endpoint_insecure = true

[proposer_config]
url = "https://wire.proposer/config.json"
file = "/etc/rvc/wire/proposer.json"
refresh_interval = 48
url_token = "wire-token"
url_insecure = true

[logfile]
path = "/var/log/rvc/wire.log"
max_size = 77
max_number = 4
compress = true
level = "warn"
