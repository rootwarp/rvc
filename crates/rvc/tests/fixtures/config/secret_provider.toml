# ARCH-4d corpus: secret-provider knobs (already nested; not one of the 7 RF5-12
# tables). Covers CliOverrides secret_provider / gcp_* / secret_refresh_* /
# secret_provider_strict.

[secret_provider]
providers = ["gcp"]
refresh_interval = 321
strict = true

[secret_provider.gcp]
project_id = "wire-gcp-project"
secret_prefix = "wire-validator-key-"
