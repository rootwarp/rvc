[package]
name = "rvc"
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
gcp-secret = ["secret-provider/gcp-secret"]

[dependencies]
async-trait.workspace = true
builder.workspace = true
doppelganger.workspace = true
eth-types.workspace = true
beacon.workspace = true
bn-manager.workspace = true
block-service.workspace = true
clap.workspace = true
crypto.workspace = true
observability.workspace = true
remote-signer-client.workspace = true
duty-tracker.workspace = true
fd-lock.workspace = true
grpc-signer.workspace = true
hex.workspace = true
keymanager-api.workspace = true
metrics.workspace = true
parking_lot.workspace = true
secrecy.workspace = true
serde_json.workspace = true
secret-provider.workspace = true
signer.workspace = true
slashing.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
timing.workspace = true
libc.workspace = true
reqwest.workspace = true
rvc-config.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tree_hash.workspace = true
url.workspace = true
validator-store.workspace = true

[dev-dependencies]
axum.workspace = true
# test-utils: shared MockBeaconNodeClient for unit/integration tests (RF4-24).
bn-manager = { workspace = true, features = ["test-utils"] }
crypto.workspace = true
# ARCH-7b: valid Deneb body fixtures for proposal success path in M1 harness.
eth-types = { workspace = true, features = ["test-fixtures"] }
rvc-gloas = { workspace = true, features = ["test-fixtures"] }
http-body-util.workspace = true
# Used by pipeline_slashing.rs to poison a file-backed SlashingDb (DROP TABLE)
# for the RF1-02 fail-closed DB-error integration test.
rusqlite = { workspace = true, features = ["bundled"] }
secrecy.workspace = true
serde_json.workspace = true
# test-utils: AlwaysEnabled for orchestrator unit/integration tests (SEC-2a).
signer = { workspace = true, features = ["test-utils"] }
tempfile.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tower = { workspace = true, features = ["util"] }
tracing-subscriber = { workspace = true, features = ["registry", "fmt"] }
tracing-test.workspace = true
# ARCH-7b: `start_paused` / `time::pause` for virtual multi-second duty stalls.
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true
criterion.workspace = true

# Per-slot latency-sanity companion (issue 2.13). Run via `cargo bench`; NOT a
# blocking gate and NOT run under nextest/CI.
[[bench]]
name = "per_slot"
harness = false
