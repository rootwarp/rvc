[package]
name = "rvc-doppelganger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Doppelganger detection for Ethereum validator client"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rootwarp/rvc"
keywords = ["ethereum", "validator", "doppelganger", "safety"]
categories = ["cryptography::cryptocurrencies"]

[lints]
workspace = true

[features]
default = []
# Rendezvous hooks for the detection latch. Production binaries do not enable it.
test-utils = []

[dependencies]
crypto = { workspace = true }
observability = { workspace = true }
eth-types = { workspace = true }
slashing = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
crypto = { workspace = true }
slashing = { workspace = true }
hex = { workspace = true }
proptest.workspace = true
tokio = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
tracing-subscriber = { workspace = true, features = ["registry"] }
