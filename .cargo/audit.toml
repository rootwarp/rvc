[advisories]
ignore = [
    # derivative: unmaintained, transitive via ark-ff → ruint → alloy-primitives.
    # No direct upgrade path — ark-ff depends on derivative.
    "RUSTSEC-2024-0388",

    # paste: unmaintained, transitive via ark-ff and alloy-primitives.
    # No direct upgrade path — multiple upstream crates depend on paste.
    "RUSTSEC-2024-0436",

    # rustls-pemfile: unmaintained (RUSTSEC-2025-0134). Transitive via tonic 0.12
    # (and related gRPC stack). Migration to rustls-pki-types is blocked until
    # the workspace can move to tonic 0.13+; do not bump tonic solely for this.
    # cargo-audit treats unmaintained as a non-fatal warning by default; this
    # ignore documents the accepted residual for CI/policy clarity.
    "RUSTSEC-2025-0134",

    # crypto-bigint timing variability (RUSTSEC-2026-0387, 2026-10-23).
    # The lockfile has 0.5.5 via elliptic-curve 0.13.8 and 0.6.1 via vsss-rs 5.3.0.
    # The advisory's fix is >=0.7.6. Those parents do not depend on that release.
    # Cargo.lock is unchanged.
    "RUSTSEC-2026-0387",
]
