# cargo-audit policy. Keep this list equal to the ignore list in `deny.toml`
# (cargo-deny), with the same reasons. `scripts/tests/test_advisory_policy.py`
# compares the two lists. cargo-audit only warns for unsound and unmaintained
# advisories. cargo-deny fails on them.
[advisories]
ignore = [
    # derivative: unmaintained. In Cargo.lock, ark-ff 0.3/0.4 depend on it, and
    # ruint and alloy-primitives depend on ark-ff. No enabled feature links
    # ark-ff 0.3/0.4, so derivative is not compiled. cargo-audit reads Cargo.lock
    # and reports it. ark-ff depends on it and has no upgrade path.
    # `scripts/check_lock_only_advisories.py` fails CI if derivative enters
    # the build graph.
    # Review by 2027-01-26.
    "RUSTSEC-2024-0388",

    # paste: unmaintained proc-macro. Transitive through alloy-primitives 0.8 and
    # 1.x (ethereum_ssz, ethereum_serde_utils, tree_hash). Reachable in
    # production builds, but only at compile time. Many upstream crates depend
    # on it and have no upgrade path.
    # Review by 2027-01-26.
    "RUSTSEC-2024-0436",

    # rustls-pemfile: unmaintained. Reachable in production on two paths:
    # - tonic 0.12 (grpc-signer, signer-proto, signer-server, telemetry). The
    #   move away from it is blocked until the workspace moves to tonic 0.13+.
    #   Do not bump tonic only for this advisory.
    # - Direct calls in crates/signer-server/src/http_api/tls_config/mod.rs. The
    #   PemObject API of rustls-pki-types can replace them now. A follow-up
    #   issue tracks that change.
    # Review by 2027-01-26.
    "RUSTSEC-2025-0134",

    # unsafe-libyaml: unmaintained. Transitive through serde_yaml 0.9 and
    # rvc-spec-vectors. rvc-spec-vectors is a dev-dependency and the gen-spec-kat
    # codegen tool. Test-only: the shipped binaries do not link it.
    # serde_yaml 0.9 is deprecated with no replacement release.
    # Review by 2027-01-26.
    "RUSTSEC-2024-0449",

    # crypto-bigint timing variability (RUSTSEC-2026-0387, 2026-10-23). The fix
    # is >=0.7.6. Only 0.5.5 is compiled, through elliptic-curve 0.13.8
    # (bls12_381_plus, vsss-rs), with the `dvt` feature of rvc-signer-server.
    # `dvt` is a release feature (Dockerfile SIGNER_FEATURES). 0.6.1 is only in
    # Cargo.lock: the vsss-rs `bigint` feature is off. bls12_381_plus does its
    # Scalar arithmetic with its own u64 limb code. It uses crypto-bigint types
    # only to convert and encode values. blst makes the DVT partial signatures
    # and combines them.
    # Review by 2027-01-26.
    "RUSTSEC-2026-0387",

    # pin-utils: unmaintained (RUSTSEC-2026-0441). Transitive through hyper 1.8
    # (axum, reqwest, tonic, hyper-util). Reachable in production builds.
    # Do not bump hyper/axum only for this advisory. pin-utils is unmaintained.
    # hyper 1.x depends on it. Transitive only, no direct use.
    # Review by 2027-01-26.
    "RUSTSEC-2026-0441",

    # heapless 0.8.0: unsound (RUSTSEC-2026-0574 to -0582, 2026-11-18). The fix
    # is >=0.9.4. Path in Cargo.lock: vsss-rs 5.3.0 -> elliptic-curve-tools
    # 0.2.0 -> heapless 0.8.0. vsss-rs enables elliptic-curve-tools only with its
    # `serde` feature. The workspace sets vsss-rs to default-features = false,
    # features = ["std"], so heapless is not compiled (`cargo tree -i
    # heapless@0.8.0 --workspace --all-features --target all` prints nothing).
    # Lock-resident only. vsss-rs 5.3 requires elliptic-curve-tools 0.2, and
    # elliptic-curve-tools 0.2 requires heapless 0.8, so `cargo update` cannot
    # remove it.
    # cargo-audit and cargo-deny match the package version (patched >= 0.9.4),
    # not the affected functions. Each entry gives the function range of the
    # advisory. `scripts/check_lock_only_advisories.py` (CI Check job) fails
    # if heapless < 0.9.4 enters the build graph.
    # heapless FindMutView::pop use after free. Functions < 0.9.4. 0.8.0 has this
    # function as FindMut::pop. Review by 2027-01-26.
    "RUSTSEC-2026-0574",
    # heapless Spsc::peek Relaxed ordering. Functions < 0.9.4. 0.8.0 has this
    # function as spsc::Queue::peek and Consumer::peek. Review by 2027-01-26.
    "RUSTSEC-2026-0575",
    # heapless IndexMap::truncate inconsistent state. Functions < 0.9.4. 0.8.0 has
    # no IndexMap::truncate: package-level scanner match. Review by 2027-01-26.
    "RUSTSEC-2026-0576",
    # heapless panicking Drop UB. Functions < 0.9.3 (clear) and < 0.9.4 (retain,
    # truncate, IntoIter::drop, HistoryBuf::write). 0.8.0 is in range.
    # Review by 2027-01-26.
    "RUSTSEC-2026-0577",
    # heapless SortedLinkedList::zeroize inconsistent state. Functions < 0.9.4.
    # 0.8.0 has no zeroize for it: package-level scanner match.
    # Review by 2027-01-26.
    "RUSTSEC-2026-0578",
    # heapless Deque::try_from when full. Functions >= 0.9.2, < 0.9.4. 0.8.0 is
    # outside that range: package-level scanner match. Review by 2027-01-26.
    "RUSTSEC-2026-0579",
    # heapless treiber stack race. Functions < 0.9.4 (arc_pool, box_pool,
    # object_pool). 0.8.0 has pool::arc, boxed, object on the treiber stack.
    # Review by 2027-01-26.
    "RUSTSEC-2026-0580",
    # heapless Deque::make_contiguous broken invariants. Functions < 0.9.4. 0.8.0
    # has no Deque::make_contiguous: package-level scanner match.
    # Review by 2027-01-26.
    "RUSTSEC-2026-0581",
    # heapless IndexMap::insert at u16::MAX elements. Functions < 0.9.4. 0.8.0 is
    # in range. Review by 2027-01-26.
    "RUSTSEC-2026-0582",

    # chrono: unmaintained (RUSTSEC-2026-0543, 2026-09-14). All versions are
    # affected. Path in Cargo.lock: serde_with 3.17 (google-cloud-* crates,
    # ark-serialize) -> chrono 0.4.44, through the optional `chrono_0_4`
    # dependency. No crate enables the serde_with `chrono` feature, so chrono
    # is not compiled (`cargo tree -i chrono@0.4.44 --workspace --all-features
    # --target all` prints nothing). Lock-resident only. No patched version.
    # `scripts/check_lock_only_advisories.py` fails CI if chrono enters the
    # build graph.
    # Review by 2027-01-26.
    "RUSTSEC-2026-0543",
]
