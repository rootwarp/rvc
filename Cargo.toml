[workspace]
members = ["bin/rvc", "bin/rvc-keygen", "bin/rvc-signer", "crates/architecture-tests", "crates/beacon", "crates/block-service", "crates/bn-manager", "crates/builder", "crates/crypto", "crates/doppelganger", "crates/duty-tracker", "crates/eth-types", "crates/grpc-signer", "crates/keymanager-api", "crates/metrics", "crates/observability", "crates/remote-signer-client", "crates/rvc", "crates/rvc-config", "crates/rvc-spec-vectors", "crates/rvc-test-support", "crates/secret-provider", "crates/signer", "crates/signer-proto", "crates/signer-registry", "crates/signer-server", "crates/slashing", "crates/telemetry", "crates/timing", "crates/validator-store", "crates/web3signer-wire"]
default-members = ["bin/rvc", "crates/architecture-tests"]
resolver = "2"

# Use `deny` (not `forbid`) so file-level `#![allow(unsafe_code)]` remains possible for
# the reviewed test-only allow-list (GlobalAlloc counters, env::set_var in tests).
# `forbid` cannot be overridden and would break that allow-list.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rootwarp/rvc"

[workspace.dependencies]
# Internal
rvc = { path = "crates/rvc" }
rvc-config = { path = "crates/rvc-config" }
beacon = { path = "crates/beacon" }
eth-types = { path = "crates/eth-types", package = "rvc-eth-types" }
metrics = { path = "crates/metrics", package = "rvc-metrics" }
slashing = { path = "crates/slashing", package = "rvc-slashing" }
timing = { path = "crates/timing", package = "rvc-timing" }
crypto = { path = "crates/crypto", package = "rvc-crypto" }
remote-signer-client = { path = "crates/remote-signer-client", package = "rvc-remote-signer-client" }
observability = { path = "crates/observability", package = "rvc-observability" }
duty-tracker = { path = "crates/duty-tracker", package = "rvc-duty-tracker" }
signer = { path = "crates/signer", package = "rvc-signer" }
validator-store = { path = "crates/validator-store", package = "rvc-validator-store" }
block-service = { path = "crates/block-service", package = "rvc-block-service" }
bn-manager = { path = "crates/bn-manager", package = "rvc-bn-manager" }
builder = { path = "crates/builder", package = "rvc-builder" }
doppelganger = { path = "crates/doppelganger", package = "rvc-doppelganger" }
keymanager-api = { path = "crates/keymanager-api", package = "rvc-keymanager-api" }
telemetry = { path = "crates/telemetry", package = "rvc-telemetry" }
secret-provider = { path = "crates/secret-provider", package = "rvc-secret-provider" }
grpc-signer = { path = "crates/grpc-signer", package = "rvc-grpc-signer" }
signer-registry = { path = "crates/signer-registry", package = "rvc-signer-registry" }
web3signer-wire = { path = "crates/web3signer-wire", package = "rvc-web3signer-wire" }
signer-proto = { path = "crates/signer-proto", package = "rvc-signer-proto" }
signer-server = { path = "crates/signer-server", package = "rvc-signer-server" }
rvc-test-support = { path = "crates/rvc-test-support" }

# External
async-trait = "0.1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
parking_lot = "0.12"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-opentelemetry = "0.32"
clap = { version = "4", features = ["derive"] }
tonic = "0.12"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
reqwest-eventsource = "0.6"
futures = "0.3"
hyper = "1"
http-body-util = "0.1"
rcgen = "0.13"

# OpenTelemetry
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }

# Metrics
prometheus = { version = "0.14", default-features = false }
lazy_static = "1.5"

# Serde utils
ethereum_serde_utils = "0.8"

# Crypto
blst = "0.3"
hex = "0.4"
rand = "0.8"
ssz = { package = "ethereum_ssz", version = "0.9" }
ssz_derive = { package = "ethereum_ssz_derive", version = "0.9" }
# ethereum_ssz 0.8 (lib name `ssz`) aliased as `ssz08` for BeaconBlockBody Encode/Decode.
# ssz_types 0.10.1 implements Encode/Decode against 0.8 only; workspace `ssz` stays on 0.9
# for the rest of eth-types. Same resolved crate instance as ssz_types' dep (no new dual).
ssz08 = { package = "ethereum_ssz", version = "0.8.3" }
# VariableList / FixedVector / BitVector with compile-time limits. 0.10.1 is the
# last release on tree_hash 0.9 / ethereum_ssz 0.8 (tree_hash 0.9 itself pins
# ethereum_ssz 0.8 for Bitfield). Do not jump to 0.11+ without a workspace-wide
# tree_hash upgrade — those pin tree_hash ≥ 0.10.
ssz_types = "0.10.1"
tree_hash = "0.9"
tree_hash_derive = "0.9"
# Exact =0.3.0 (no caret). Do not enable ethereum-types.
# Published 0.3.0 names: hasher is sha2-backend on libssz-merkle; other crates have no sha2 feature.
libssz = { version = "=0.3.0", default-features = false, features = ["alloc"] }
libssz-merkle = { version = "=0.3.0", default-features = false, features = ["alloc", "sha2-backend"] }
libssz-types = { version = "=0.3.0", default-features = false, features = ["alloc"] }
libssz-derive = { version = "=0.3.0", default-features = false }
sha2 = "0.10"
url = "2"
scrypt = "0.11"
pbkdf2 = "0.12"
aes = "0.8"
ctr = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
secrecy = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
hkdf = "0.12"
num-bigint = "0.4"
bip39 = { version = "2.2", features = ["zeroize", "rand"] }
rpassword = "5"
tiny-keccak = { version = "2", features = ["keccak"] }
rayon = "1"
tokio-util = "0.7"
tokio-stream = "0.1"

# DVT (Distributed Validator Technology)
vsss-rs = { version = "5.3", default-features = false, features = ["std"] }
bls12_381_plus = "0.8"

# Bytes
bytes = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# File locking
fd-lock = "4"

# System info
libc = "0.2"

# Log rotation
logroller = "0.1"
tracing-appender = "0.2"
flate2 = "1"
snap = "1"

# X.509 parsing (pinned; used by rvc-signer audit/cn.rs — M-4 fix)
x509-parser = "0.16"

# Dev dependencies
tempfile = "3"
wiremock = "0.6"
proptest = "1"
tracing-test = "0.2"
# Bench harness (Phase-2 issue 2.13); cargo_bench_support only — no plotters/rayon
# report deps, keeping the added surface minimal. Not run under nextest/CI.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[workspace.dependencies.tonic-build]
version = "0.12"

# Optimize all third-party dependencies (incl. scrypt/bls/sha2 KDF+crypto) even in
# debug/test builds. Workspace crates stay unoptimized for fast incremental builds and
# clean backtraces; only deps are optimized. Cuts crypto-heavy test time ~3-5x.
[profile.dev.package."*"]
opt-level = 3
