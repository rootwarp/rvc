# Docker Compose for rvc validator client + remote signer
#
# Usage:
#   docker compose up                           # Start services (build from source)
#   docker compose --profile tracing up -d      # Also start Jaeger v2 (UI/OTLP loopback)
#   docker compose --profile tracing-tailsample up -d jaeger-tailsample
#                                               # Dev/demo tail sampling (do not combine
#                                               # with --profile tracing; same host ports)
#   docker compose build                        # Build images only
#   docker compose down                         # Stop and remove containers
#
# For production, replace 'build' with 'image' directives:
#   image: ghcr.io/rootwarp/rvc/rvc:latest

services:
  rvc:
    build:
      context: .
      dockerfile: Dockerfile
      target: rvc
    # image: ghcr.io/rootwarp/rvc/rvc:latest
    ports:
      - "8080:8080"   # Metrics and health
      - "5062:5062"   # Keymanager API (optional)
    volumes:
      - ./config:/config:ro
      - rvc-data:/data
    environment:
      # Path-less endpoint — TRC-1b appends /v1/traces. Sample rate 1.0 for
      # local visibility (compose recipe); override for production.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_TRACES_SAMPLER_ARG=1.0
      # - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - rvc-net
    depends_on:
      rvc-signer:
        condition: service_healthy

  rvc-signer:
    build:
      context: .
      dockerfile: Dockerfile
      target: rvc-signer
    # image: ghcr.io/rootwarp/rvc/rvc-signer:latest
    ports:
      - "127.0.0.1:9101:9101" # Metrics (localhost only)
    volumes:
      - ./config:/config:ro
      - ./certs:/certs:ro
      - signer-data:/data
    environment:
      # Wired for Phase 2B; signer ignores OTEL until then (inert).
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_TRACES_SAMPLER_ARG=1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9101/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - rvc-net

  # Jaeger v2 all-in-one — opt-in via --profile tracing so bare
  # `docker compose up` is unchanged (service set stays rvc + rvc-signer).
  #
  # Do NOT set COLLECTOR_OTLP_ENABLED — that is a Jaeger v1 env trap; v2
  # enables OTLP by default and ignores / misleads with that variable.
  jaeger:
    profiles: ["tracing"]
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.11.0@sha256:b585df1b6299bbbd16bf7c679da30389349736e4b6bc8f4f500142a75bf26ca8
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI (loopback only)
      - "127.0.0.1:4318:4318"   # OTLP/HTTP (host-local only)
      # 4317 (OTLP/gRPC) intentionally unpublished — HTTP-only by design.
    networks:
      - rvc-net
    restart: unless-stopped

  # Dev/demo tail sampling. Own profile so `docker compose up` and
  # `--profile tracing` stay the same service set, image, and config.
  #
  # Same pinned Jaeger image as `jaeger`. Its `components` list includes
  # the `tail_sampling` processor, so this profile does not add an
  # otel-collector-contrib service. Config: config/jaeger/tail-sampling.yaml.
  #
  # Not a production topology. Do not enable together with `tracing`
  # (both publish 127.0.0.1:16686 and 127.0.0.1:4318). The network alias
  # `jaeger` lets the existing OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
  # setting reach this container when `tracing` is not also running.
  jaeger-tailsample:
    profiles: ["tracing-tailsample"]
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.11.0@sha256:b585df1b6299bbbd16bf7c679da30389349736e4b6bc8f4f500142a75bf26ca8
    command: ["--config", "/tmp/tail-sampling.yaml"]
    volumes:
      - ./config/jaeger/tail-sampling.yaml:/tmp/tail-sampling.yaml:ro
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI (loopback only)
      - "127.0.0.1:4318:4318"   # OTLP/HTTP (host-local only)
      # 4317 (OTLP/gRPC) intentionally unpublished — HTTP-only by design.
    networks:
      rvc-net:
        aliases:
          - jaeger
    restart: unless-stopped

volumes:
  rvc-data:
  signer-data:

networks:
  rvc-net:
    driver: bridge
