# Gate 2 (structured-logging / observability initiative): gitleaks secret-scan config (SOURCE tree).
#
# Design: keep ALL curated gitleaks default rules via `useDefault`.
# The global allow-list contains NO content/value regexes and does not set a
# regex target. Extended default allow regexes therefore stay on the captured
# secret, which is the gitleaks default. Setting the target to the whole line
# would make the extended default pattern for the words true, false, and null
# skip any line that contains those words, including a real secret.
# Every intentional in-src test finding is baselined by EXACT fingerprint
# (`file:rule:line`) in `.gitleaksignore`. A new secret — even a 64-hex key
# in one of those same files on a new line — is a new fingerprint and FAILS the gate.
# An inline allow signature on the finding's own line is a built-in skip.
# A comment on a neighboring line does not suppress the finding, so prose
# around a sample stays scanned. Do not put that signature inside a fenced
# sample that is shown as program output.
# The fenced log line in docs/running-guide.md is allowed only by a
# generic-api-key rule allowlist with condition AND: that path, and the exact
# captured truncated pubkey. The same value in any other file FAILS the gate.
# A different secret on that path also FAILS the gate.
#
# Path allow-lists:
#   - `target/`: build artifacts, never source.
#   - `tests/`: whole integration-test trees (published Eth2 slashing-interchange vectors, mock
#     beacon responses, etc.). RISK-ACCEPT: a real secret committed under `tests/` would be
#     ignored; mitigated by the fact these are fixtures, by Gate 1/Gate 3, and by review.
#   (The single non-secret hex test input in crates/crypto/examples/log_sample.rs is baselined by
#   fingerprint in .gitleaksignore — NOT a directory-wide path allow — so a NEW file added under
#   crates/crypto/examples/ with a real secret is still scanned and caught.)
#
# What this gate does and does NOT catch: it catches keyworded secrets (PEM private keys, cloud
# creds, PATs, `key/secret/token = <high-entropy>`). It does NOT catch a *bare* 64-hex literal
# with no adjacent keyword (`const X = "…"`) — that residual is covered by Gate 1 (clippy
# disallowed-methods) + the secrecy/Zeroizing type layer + Gate 3 (captured-subscriber tests).
# The emitted-`trace`-sample scan uses a separate `.gitleaks-emitted.toml` (the only place the
# `0x{10}...{8}` redaction shape is allow-listed, and only over our own generated output).

title = "rs-vc secret-scan allowlist (source tree)"

[extend]
useDefault = true

[allowlist]
description = "Build artifacts and whole-test trees"
paths = [
  '''(^|/)target/''',
  '''(^|/)tests/''',
]

# Exact captured secret from the running-guide log sample. AND with the path:
# the same value anywhere else is still a finding. Default regex target (the
# secret), not the line.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Truncated pubkey on the docs/running-guide.md trace sample line"
condition = "AND"
paths = [
  '''(^|/)docs/running-guide\.md$''',
]
regexes = [
  '''^0x97f1d3a731\.\.\.db22c6bb$''',
]
