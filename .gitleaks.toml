# Gate 2 (structured-logging / observability initiative): gitleaks secret-scan config (SOURCE tree).
#
# Design: keep ALL curated gitleaks default rules via `useDefault`.
# The global allow-list contains NO content/value regexes and does not set a
# regex target. Extended default allow regexes therefore stay on the captured
# secret, which is the gitleaks default. Setting the target to the whole line
# would make the extended default pattern for the words true, false, and null
# skip any line that contains those words, including a real secret.
#
# Intentional fixture findings are allow-listed per rule, per file, and per
# exact captured value. Each [[rules.allowlists]] entry uses condition AND,
# one anchored path, and anchored regexes. A regex equals one captured
# value. One fixture in crates/slashing/src/db/interchange.rs straddles a
# 10000-byte read, so that file lists every prefix of that value from length
# 35 through 98. A captured prefix in that range is allowed there, including
# when a different token is cut down to one of those prefixes by a chunk
# boundary. The same prefix in any other file is not. Every other file lists
# only the full value. Splitting one of those across a chunk boundary fails
# closed when the captured prefix is one the rule still reports. For
# crates/beacon/src/types.rs that is every prefix of length 34 or more.
# Paths no longer in the tree keep an exact entry so a history scan stays
# clean. Four entries are history findings on files that are still in the
# tree, not retired paths: bin/rvc/src/commands/voluntary_exit.rs,
# crates/beacon/src/client.rs, crates/eth-types/src/duties.rs, and
# crates/grpc-signer/src/client.rs. That text is not in the current files.
# crates/duty-tracker/src/tracker.rs is a current file and its allowlisted
# text is in that file.
# A line move does not retune an entry whose captured text stays the same.
# Gitleaks reads the working tree in 10000-byte chunks with no overlap, so an
# insertion that pushes some other value across a chunk boundary changes the
# captured prefix. That new prefix is a finding until it is added here.
# crates/crypto/src/key_manager.rs is the next value close to a boundary
# (63 bytes of slack).
#
# Adding a fixture: from the repo root, run
#   gitleaks detect --no-git --source . --config .gitleaks.toml \
#     --ignore-gitleaks-allow --no-banner --report-format json --report-path -
# without --redact. Escape the captured value as a fully anchored literal
# (escape regex punctuation, and escape '-' so the text has no private-key
# begin marker) and add it under that file's block. Gitleaks skips the file
# named by --config, so a clean scan of this file is not evidence about that
# text. Do not add a path-wide or repo-wide value allow. Do not set a regex
# target on these blocks: the default target is the captured secret.
# scripts/tests/test_gitleaks_allowlist.py compares keys without regard to
# case, rejects unknown keys and case-only duplicates, and requires condition
# AND. line and match targets are rejected in any case because the key is
# unknown. That guard reads only this file. It does not inspect allowlists
# that useDefault merges in from the default rules. The architecture gate
# that reads this file also rejects a regex-target key in any case.
#
# Inline allow comments are not a baseline. CI passes --ignore-gitleaks-allow
# so a comment cannot suppress a finding. Do not put an inline allow token
# in this file.
#
# Path allow-lists (global):
#   - `target/`: build artifacts, never source.
#   - `tests/`: whole integration-test trees (published Eth2 slashing-interchange vectors, mock
#     beacon responses, etc.). RISK-ACCEPT: a real secret committed under `tests/` would be
#     ignored; mitigated by the fact these are fixtures, by Gate 1/Gate 3, and by review.
#
# What this gate does and does NOT catch: it catches keyworded secrets (PEM private keys, cloud
# creds, PATs, `key/secret/token = <high-entropy>`). It does NOT catch a *bare* 64-hex literal
# with no adjacent keyword (`const X = "…"`) — that residual is covered by Gate 1 (clippy
# disallowed-methods) + the secrecy/Zeroizing type layer + Gate 3 (captured-subscriber tests).
# The emitted-`trace`-sample scan uses a separate `.gitleaks-emitted.toml` (the only place the
# `0x{10}...{8}` redaction shape is allow-listed, and only over our own generated output).

title = "rs-vc secret-scan allowlist (source tree)"

[extend]
useDefault = true

[allowlist]
description = "Build artifacts and whole-test trees"
paths = [
  '''(^|/)target/''',
  '''(^|/)tests/''',
]

# Captured fixture secrets. AND with one exact path: the same value anywhere
# else is still a finding. Default regex target (the captured secret).
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Truncated pubkey on the docs/running-guide.md trace sample line"
condition = "AND"
paths = [
  '''^docs/running\-guide\.md$''',
]
regexes = [
  '''^0x97f1d3a731\.\.\.db22c6bb$''',
]

