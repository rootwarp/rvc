# Fixture matching scripts/tests/test_devnet_preflight.py. Not a live devnet.
PRESET_BASE: 'mainnet'
CONFIG_NAME: 'preflight' # inline comment must not leak into the value

# Gloas
GLOAS_FORK_VERSION: 0x08000000
GLOAS_FORK_EPOCH: 70

# Time parameters
SLOT_DURATION_MS: 12000
ATTESTATION_DUE_BPS: 3333
AGGREGATE_DUE_BPS: 6667
SYNC_MESSAGE_DUE_BPS: 3333
CONTRIBUTION_DUE_BPS: 6667
ATTESTATION_DUE_BPS_GLOAS: 2500
# Devnet-10 ships 6667; the spec default is 5000. Preflight reports this
# value and never asserts a winner.
AGGREGATE_DUE_BPS_GLOAS: 6667
SYNC_MESSAGE_DUE_BPS_GLOAS: 2500
CONTRIBUTION_DUE_BPS_GLOAS: 5000
PAYLOAD_DUE_BPS: 5000
PAYLOAD_ATTESTATION_DUE_BPS: 7500

# Nested lists must be ignored by the scalar parser.
BLOB_SCHEDULE:
  - EPOCH: 0
    MAX_BLOBS_PER_BLOCK: 21
