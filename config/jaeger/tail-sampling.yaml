# Dev/demo tail sampling for the pinned Jaeger v2 all-in-one image.
#
# This file is a local demonstration topology. It is not a production
# recommendation: a production deployment needs a load-balancing collector
# tier so every span of a trace hits the same sampler, plus storage and
# memory sizing this in-memory all-in-one does not provide. Production
# backend topology stays out of scope.
#
# The processor is Jaeger's built-in `tail_sampling` (otel collector-contrib
# tailsamplingprocessor, compiled into jaeger:2.11.0). No second collector
# image is used.
#
# Head sampling inside rvc is unchanged (ADR-005 DEFAULT_TRACING_SAMPLE_RATE
# stays 0.01). This file does not sample in-process.
#
# Policies are OR'd. A trace is kept when any policy returns Sampled:
#   1. span event name "Missed attestation deadline" (100%)
#   2. any span with status ERROR (100%)
#   3. everything else, 10% (sampling_percentage below)
#
# The 10% remainder is this collector's rate. It is not the ADR-005 head
# rate and it does not change OTEL_TRACES_SAMPLER_ARG on the `tracing`
# profile.
#
# decision_wait is 20s: the missed-deadline warn fires about 4s into the
# slot, and the SDK batch exporter can hold the span until the slot ends
# (~12s) plus the batch delay. The timer starts at the first span.
#
# The warn is a tracing event. tracing-opentelemetry records it as a span
# event named "Missed attestation deadline" only when a span is current.
# A log line with no current span never reaches this processor.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: some_storage
    http:
      endpoint: 0.0.0.0:16686

  jaeger_storage:
    backends:
      some_storage:
        memory:
          max_traces: 100000

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  tail_sampling:
    decision_wait: 20s
    num_traces: 10000
    expected_new_traces_per_sec: 10
    policies:
      - name: keep-missed-attestation-deadline
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          spanevent:
            - 'name == "Missed attestation deadline"'
      - name: keep-error-status
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: sample-remainder
        type: probabilistic
        probabilistic:
          # 10% of traces that match neither policy above.
          # Default hash salt is "default-hash-seed" (processor default).
          sampling_percentage: 10

exporters:
  jaeger_storage_exporter:
    trace_storage: some_storage
