[package]
name = "rvc-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "rvc"
path = "src/main.rs"

[features]
default = []
gcp-trace = ["telemetry/gcp-trace"]
gcp-secret = ["rvc/gcp-secret", "dep:rustls"]

[dependencies]
beacon.workspace = true
crypto.workspace = true
eth-types.workspace = true
hex.workspace = true
metrics.workspace = true
rvc.workspace = true
signer.workspace = true
telemetry.workspace = true
slashing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
clap.workspace = true
# release_max_level_debug: trace! (and below-cap spans) compile to nothing in
# --release; debug! stays RUST_LOG-switchable. The `log` bridge feature is NOT
# enabled (it reintroduces cost under a static cap; ADR-001).
tracing = { workspace = true, features = ["release_max_level_debug"] }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring"] }

[dev-dependencies]
# eth-types / hex / serde_json are production deps above; integration tests reuse
# them via normal dependency inheritance (no duplicate dev-dep lines).
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
reqwest = { workspace = true, features = ["blocking"] }
libc.workspace = true
wiremock.workspace = true
