[package]
name = "rvc-signer-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "rvc-signer"
path = "src/main.rs"

[features]
default = []
# Forward DVT to the server library (feature-unified with signer-server).
dvt = ["signer-server/dvt"]

[dependencies]
clap.workspace = true
signer-server = { workspace = true }
telemetry.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing = { workspace = true, features = ["release_max_level_debug"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Binary-level startup tests (cli_startup / common harness) + main unit tests.
crypto = { workspace = true, features = ["test-utils"] }
hex.workspace = true
libc = "0.2"
reqwest.workspace = true
rvc-config.workspace = true
rvc-test-support.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
