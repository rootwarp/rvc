# cargo-deny policy. CI runs `cargo deny check advisories sources` next to
# `cargo audit`. The advisories and sources checks are configured. The bans and
# licenses checks need a large allow-list for the current tree, so CI does not
# run them.
#
# Each ignore below is also in `.cargo/audit.toml`, with the same reason.
# `scripts/tests/test_advisory_policy.py` makes sure that the two lists agree.
# Review all ignores by 2027-01-26.

[graph]
# Include optional features (for example `dvt`), as the all-features clippy step does.
all-features = true

[advisories]
# Fail on unsound and unmaintained advisories for all crates, not only for
# workspace crates. cargo-audit only warns for these kinds.
unsound = "all"
unmaintained = "all"
yanked = "deny"
ignore = [
    # derivative: unmaintained. In Cargo.lock, ark-ff 0.3/0.4 depend on it, and
    # ruint and alloy-primitives depend on ark-ff. No enabled feature links
    # ark-ff 0.3/0.4, so derivative is not compiled. cargo-audit reads Cargo.lock
    # and reports it. cargo-deny reads the resolved graph and does not, so
    # cargo-deny warns that this ignore is not used. Keep it to mirror
    # `.cargo/audit.toml`.
    # Review by 2027-01-26.
    { id = "RUSTSEC-2024-0388", reason = "derivative is unmaintained. ark-ff depends on it and has no upgrade path. Lock-resident only, not compiled." },

    # paste: unmaintained proc-macro. Transitive through alloy-primitives 0.8 and
    # 1.x (ethereum_ssz, ethereum_serde_utils, tree_hash). Reachable in
    # production builds, but only at compile time.
    # Review by 2027-01-26.
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained. Many upstream crates depend on it and have no upgrade path." },

    # rustls-pemfile: unmaintained. Reachable in production on two paths:
    # - tonic 0.12 (grpc-signer, signer-proto, signer-server, telemetry). The
    #   move away from it is blocked until the workspace moves to tonic 0.13+.
    #   Do not bump tonic only for this advisory.
    # - Direct calls in crates/signer-server/src/http_api/tls_config/mod.rs. The
    #   PemObject API of rustls-pki-types can replace them now. A follow-up
    #   issue tracks that change.
    # Review by 2027-01-26.
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained. tonic 0.12 needs it until tonic 0.13+. The direct calls in signer-server are tracked in a follow-up issue." },

    # unsafe-libyaml: unmaintained. Transitive through serde_yaml 0.9 and
    # rvc-spec-vectors. rvc-spec-vectors is a dev-dependency and the gen-spec-kat
    # codegen tool. Test-only: the shipped binaries do not link it.
    # serde_yaml 0.9 is deprecated with no replacement release.
    # Review by 2027-01-26.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained. Test-only, through serde_yaml in rvc-spec-vectors." },

    # crypto-bigint timing variability (RUSTSEC-2026-0387, 2026-10-23). The fix
    # is >=0.7.6. Only 0.5.5 is compiled, through elliptic-curve 0.13.8
    # (bls12_381_plus, vsss-rs), with the `dvt` feature of rvc-signer-server.
    # `dvt` is a release feature (Dockerfile SIGNER_FEATURES). 0.6.1 is only in
    # Cargo.lock: the vsss-rs `bigint` feature is off. bls12_381_plus does its
    # Scalar arithmetic with its own u64 limb code. It uses crypto-bigint types
    # only to convert and encode values. blst makes the DVT partial signatures
    # and combines them.
    # Review by 2027-01-26.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint timing variability. The fix is >=0.7.6, and elliptic-curve 0.13 and vsss-rs 5.3 do not depend on it. bls12_381_plus uses it only to convert and encode, and blst signs." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
