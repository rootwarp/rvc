name: Secret history scan

# Full-history gitleaks scan. The history-only allowlist entries in
# .gitleaks.toml have no other CI consumer: the secret-scan job in ci.yml
# reads the tree and the new commits only.
on:
  schedule:
    # 04:00 UTC each Monday. GitHub only fires `schedule` on the default branch.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-scan:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A full clone: a shallow or blob:none clone does not hold the old blobs.
      # The schedule runs on the default branch, but the newest allowlist is on
      # develop, so a scheduled run checks out develop. --all still scans every
      # fetched branch.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Install gitleaks
        run: ./scripts/install_gitleaks.sh

      - name: Build the strict gitleaks configs
        run: python3 scripts/gitleaks_strict_config.py --out-dir "$RUNNER_TEMP/gitleaks"

      # The script passes -m, --text, --all and --full-history to git log, and
      # fails when gitleaks reports a git error.
      - name: Gitleaks — full history
        run: ./scripts/gitleaks_range_scan.sh "$RUNNER_TEMP/gitleaks/gitleaks.toml" --history
