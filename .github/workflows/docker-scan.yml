name: Docker scan

# PR lane for the image scan. docker.yml does not run on pull requests into
# develop, and its scan job is skipped for every pull_request, so a missing
# action ref is invisible until a tag push. Keep the trivy `uses:` line
# identical to docker.yml. The check name is `pr-scan (<target>)` so it does
# not collide with docker.yml's `scan (<target>)`. This workflow cannot push
# images.
#
# SARIF drops `severity` unless `limit-severities-for-sarif` is true, so the
# gating step's exit-code 1 is CRITICAL-only. `.trivyignore` allows only
# CVE-2023-45853. The table step prints that same filter into the job log and
# the job summary; it does not gate the job. Do not set ignore-unfixed.

on:
  pull_request:
    branches: [develop, main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker*.yml
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - bin/**
      - proto/**
      - .trivyignore
      - scripts/docker-cargo-features.sh
  schedule:
    # Monday 06:00 UTC. GitHub only fires schedule on the default branch (main).
    # Path filters do not apply to schedule or workflow_dispatch.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: pr-scan (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [rvc, rvc-signer, rvc-keygen]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.target }}:scan
          cache-from: type=gha,scope=${{ matrix.target }}

      - name: Show Trivy findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.target }}:scan
          format: table
          output: trivy-${{ matrix.target }}.txt
          severity: CRITICAL
          exit-code: '0'
          limit-severities-for-sarif: true
          trivyignores: .trivyignore

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.target }}:scan
          format: sarif
          output: trivy-${{ matrix.target }}.sarif
          severity: CRITICAL
          exit-code: '1'
          limit-severities-for-sarif: true
          trivyignores: .trivyignore

      - name: Publish Trivy findings
        if: success() || failure()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          report="trivy-${TARGET}.txt"
          {
            echo "### Trivy CRITICAL findings (${TARGET})"
            echo
            if [ -f "$report" ]; then
              echo '```'
              cat "$report"
              echo '```'
            else
              echo "Trivy table report was not written."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
