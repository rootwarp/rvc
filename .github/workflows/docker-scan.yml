name: Docker scan

# This workflow scans the images for a release. It runs only on these events:
# - a pull request into main
# - a push of a `v*` tag
# - a manual run (workflow_dispatch)
# It does not run on pull requests into develop, and it has no schedule.
# docker.yml skips its scan job for each pull_request. Thus this workflow finds
# a missing action ref in a release pull request before the tag push. Keep the
# trivy `uses:` line identical to docker.yml. The check name is
# `pr-scan (<target>)` so it does not collide with docker.yml's
# `scan (<target>)`. This workflow cannot push images.
#
# Gate policy:
# - Gate A fails the job for each CRITICAL finding. It sets ignore-unfixed to
#   false, so a CRITICAL finding without a fix also fails the job.
# - Gate B fails the job for a HIGH finding only when a fixed version exists.
#   It sets ignore-unfixed to true.
# - The table report shows each HIGH and CRITICAL finding. This includes a
#   finding without a fix. It sets ignore-unfixed to false and exit-code to 0,
#   so it does not gate the job.
# The table report is the first Trivy step, and the last step writes it to
# the job summary. Thus the job summary shows the findings also when a gate
# fails.
# SARIF drops `severity` unless `limit-severities-for-sarif` is true. Each
# Trivy step sets that flag. Each Trivy step reads `.trivyignore.yaml`. That
# file allows only CVE-2023-45853 in the Debian zlib1g package, and the entry
# expires on 2027-01-18.

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: pr-scan (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [rvc, rvc-signer, rvc-keygen]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.target }}:scan
          cache-from: type=gha,scope=${{ matrix.target }}

      - name: Show Trivy findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.target }}:scan
          format: table
          output: trivy-${{ matrix.target }}.txt
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: false
          limit-severities-for-sarif: true
          trivyignores: .trivyignore.yaml

      - name: Gate A (each CRITICAL finding)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.target }}:scan
          format: sarif
          output: trivy-${{ matrix.target }}-critical.sarif
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          limit-severities-for-sarif: true
          trivyignores: .trivyignore.yaml

      - name: Gate B (HIGH findings with a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.target }}:scan
          format: sarif
          output: trivy-${{ matrix.target }}-high.sarif
          severity: HIGH
          exit-code: '1'
          ignore-unfixed: true
          limit-severities-for-sarif: true
          trivyignores: .trivyignore.yaml

      - name: Publish Trivy findings
        if: success() || failure()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          report="trivy-${TARGET}.txt"
          {
            echo "### Trivy HIGH and CRITICAL findings (${TARGET})"
            echo
            if [ -f "$report" ]; then
              # The fence is one backtick longer than the longest backtick run
              # in the report (minimum 3), so the report cannot close it.
              longest=$(awk '{ while (match($0, /`+/)) { if (RLENGTH > max) max = RLENGTH; $0 = substr($0, RSTART + RLENGTH) } } END { print max + 0 }' "$report")
              width=$(( longest + 1 > 3 ? longest + 1 : 3 ))
              fence=$(printf "%${width}s" '' | tr ' ' '`')
              printf '%s\n' "$fence"
              cat "$report"
              printf '%s\n' "$fence"
            else
              echo "Trivy table report was not written."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
