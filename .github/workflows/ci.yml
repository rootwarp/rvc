name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Shrink CI target/ and avoid incremental artifacts that bloat caches/runners.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      # fetch-depth: 0 so the A-12 pin commit is reachable for the T19 stage.rs
      # byte-identity guard below (shallow tip alone cannot `git diff <pin>`).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: check
          cache-all-crates: "false"

      # Authenticate release lookups. Anonymous setup-protoc calls have failed
      # this job with "API rate limit exceeded".
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # T19 / TRC-1e: crates/slashing/src/stage.rs must stay byte-identical to the
      # A-12 pin. W4-S1a (#820) re-pinned the bytes. The pin is a blob: the
      # redesign is one commit, and a commit cannot contain its own SHA.
      # Do not instrument stage.rs; see plan/tracing-2026-08-06/A-12-stage-rs-repin.md.
      - name: T19 — stage.rs byte-identical to A-12 pin
        run: |
          set -euo pipefail
          PIN_BLOB=463ff36184a946a0eea0d4d4839a8bc04f74479c
          ACTUAL=$(git rev-parse "HEAD:crates/slashing/src/stage.rs")
          if [ "$ACTUAL" != "$PIN_BLOB" ]; then
            echo "T19 / A-12 FAILURE: crates/slashing/src/stage.rs is not byte-identical to the A-12 pin."
            echo "A-12 pin blob: ${PIN_BLOB}"
            echo "Actual blob: ${ACTUAL}"
            echo "Record: plan/tracing-2026-08-06/A-12-stage-rs-repin.md"
            echo "Tracing must not instrument stage.rs. Authorized redesigns re-pin via A-12; do not weaken this guard."
            exit 1
          fi
          echo "T19: stage.rs byte-identical to A-12 pin blob ${PIN_BLOB}"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run clippy (all features)
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

      - name: Run clippy (dvt feature — Gate 1 secret-sink coverage)
        run: cargo clippy -p rvc-signer-bin --all-targets --features dvt -- -D warnings

      # Dependency hygiene (SEC-10): fail closed on unignored RustSec advisories.
      # Policy ignores for known-blocked transitive crates live in `.cargo/audit.toml`.
      - name: Install cargo-audit
        if: github.event_name == 'pull_request'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit

      - name: Run cargo audit
        if: github.event_name == 'pull_request'
        run: cargo audit

      # cargo-deny reads the resolved graph (all features). It fails on unsound,
      # unmaintained, and yanked crates, and on sources other than crates.io.
      # Ignores live in `deny.toml` and must agree with `.cargo/audit.toml`.
      - name: Install cargo-deny
        if: github.event_name == 'pull_request'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny

      - name: Run cargo deny (advisories, sources)
        if: github.event_name == 'pull_request'
        run: cargo deny check advisories sources

      # Unused declared deps (ARCH-P2-6 / ARCH-5). cargo-udeps is not adopted:
      # it needs nightly; CI installs the stable toolchain (A-E3).
      - name: Install cargo-machete
        if: github.event_name == 'pull_request'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-machete

      - name: Run cargo machete
        if: github.event_name == 'pull_request'
        run: cargo machete

      # 3.9b + 5.15 / #290: graph assertion on a real libssz consumer.
      # Not blanket `cargo tree -d` emptiness — ethereum_ssz 0.9 + 0.8.3 is an
      # intentional existing dual (workspace `ssz` / `ssz08`).
      # `cargo tree -d` alone is not enough: ruint's primitive-types 0.12.2 is
      # lock-resident but not tree-linked, so enabling libssz-merkle's
      # `ethereum_types` feature adds ethereum-types + primitive-types 0.13
      # without a -d duplicate. Also scan Cargo.lock / invert-tree.
      # 5.15: no ethereum-types, exactly one primitive-types (island stack purity).
      - name: Assert no ethereum-types / single primitive-types
        run: |
          set -euo pipefail
          # Non-vacuity: 3.7 put libssz in Cargo.lock; an empty match would
          # make the graph grep succeed without a consumer.
          if ! grep -q libssz Cargo.lock; then
            echo "libssz missing from Cargo.lock — cargo tree -d assertion would be vacuous"
            exit 1
          fi
          echo "=== Cargo.lock libssz ==="
          grep -n libssz Cargo.lock
          echo "=== resolved libssz-merkle ==="
          # CARGO_TERM_COLOR=always would inject ANSI into package lines.
          tree=$(CARGO_TERM_COLOR=never cargo tree --locked --workspace --color never -i libssz-merkle)
          printf '%s\n' "$tree"
          resolved=$(printf '%s\n' "$tree" | sed -n 's/^libssz-merkle v\([0-9][0-9.]*\).*/libssz-merkle \1/p' | head -n 1)
          if [ "$resolved" != "libssz-merkle 0.3.0" ]; then
            echo "libssz-merkle 0.3.0 missing from resolved graph (got: ${resolved:-none})"
            exit 1
          fi
          echo "$resolved"
          echo "=== cargo tree -d --workspace ==="
          dups=$(CARGO_TERM_COLOR=never cargo tree --locked -d --workspace --color never)
          printf '%s\n' "$dups"
          fail=0
          if printf '%s\n' "$dups" | grep -F -- 'ethereum-types'; then
            echo "REGRESSION: ethereum-types present in cargo tree -d --workspace"
            fail=1
          fi
          # Duplicate roots are unindented "name vversion".
          pt_d=$(printf '%s\n' "$dups" | sed -n 's/^primitive-types v\([^ ]*\).*/\1/p' | sort -u | grep -c . || true)
          if [ "$pt_d" -ge 2 ]; then
            echo "REGRESSION: second primitive-types in cargo tree -d ($pt_d versions)"
            fail=1
          fi
          # Invert-tree: unique ethereum-types never appears in -d.
          if et_tree=$(CARGO_TERM_COLOR=never cargo tree --locked --workspace --color never -i ethereum-types --depth 0 2>/dev/null); then
            echo "REGRESSION: ethereum-types entered the resolved graph:"
            printf '%s\n' "$et_tree"
            fail=1
          fi
          pt_lock=$(grep -c '^name = "primitive-types"' Cargo.lock || true)
          echo "Cargo.lock primitive-types packages: $pt_lock"
          if [ "$pt_lock" -ne 1 ]; then
            echo "REGRESSION: expected exactly one primitive-types in Cargo.lock, found $pt_lock"
            awk '/^name = "primitive-types"$/{print; getline; print}' Cargo.lock
            fail=1
          fi
          if grep -q '^name = "ethereum-types"' Cargo.lock; then
            echo "REGRESSION: ethereum-types entered Cargo.lock"
            fail=1
          fi
          exit "$fail"

      # 5.15 / #290: island build/test against Cargo.lock (no silent dep float).
      - name: Build rvc-gloas
        run: cargo build -p rvc-gloas --locked

      - name: Test rvc-gloas
        run: cargo test -p rvc-gloas --locked --all-targets

  # OQ-3 / #612. Default nextest does not enable test-utils, dvt, or gcp-*.
  # `cargo test --workspace` deadlocks here; the invariant is nextest (#488).
  # Do not set RVC_SPEC_VECTORS_REQUIRED: missing vector archives must stay
  # skipped. The spec-vectors job is the one that fetches them.
  test-all-features:
    name: Test (all features)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-all-features
          cache-all-crates: "false"

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest

      - name: Run workspace tests (all features)
        run: cargo nextest run --workspace --all-features --locked

  # Runs on pull requests and on pushes to develop and main.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the git-mode scan can read the pull request or push range.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: ./scripts/install_gitleaks.sh

      # useDefault merges a default global allowlist that hides real secrets.
      # Every scan below uses the strict copies. See .gitleaks.toml.
      - name: Build the strict gitleaks configs
        run: |
          set -euo pipefail
          python3 scripts/gitleaks_strict_config.py --out-dir "$RUNNER_TEMP/gitleaks"
          {
            echo "RVC_GITLEAKS_CONFIG=$RUNNER_TEMP/gitleaks/gitleaks.toml"
            echo "RVC_GITLEAKS_EMITTED_CONFIG=$RUNNER_TEMP/gitleaks/gitleaks-emitted.toml"
          } >> "$GITHUB_ENV"

      # Gate 2a: scan the source tree (working files); fail closed on any finding.
      # --ignore-gitleaks-allow: an inline allow comment is not a baseline.
      - name: Gitleaks — source tree
        run: gitleaks detect --no-git --source . --config "$RVC_GITLEAKS_CONFIG" --ignore-gitleaks-allow --redact --no-banner --exit-code 1

      # The no-git scan misses a secret across a 10000-byte chunk boundary.
      # Git mode reads each added hunk whole, merge commits included. A force
      # push scans from the merge base. A base that is not in the clone scans
      # the full history in git mode.
      - name: Gitleaks — commits in the pull request or push range
        env:
          RANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/gitleaks_range_scan.sh "$RVC_GITLEAKS_CONFIG" "$RANGE_BASE"

      # A line that contains the word false must still surface a synthetic key.
      # The running-guide allow is path-and-value, so the same value elsewhere fails too.
      - name: Gitleaks — verify=false canary is detected
        run: ./scripts/gitleaks_verify_false_canary.sh

      # Prepend blank lines to every allowlisted file, then append a fresh key,
      # the same value on a non-allowlisted path, and prefix/suffix grafts.
      # Each of those must still fail. Removing any one allowlist entry must fail too.
      - name: Gitleaks — line-shift canary
        run: python3 scripts/gitleaks_line_shift_canary.py

      # Synthetic secrets that the default allowlist or the no-git chunking
      # hides. The strict config and the git-mode range scan must find each one.
      - name: Gitleaks — allowlist and chunk-boundary canary
        run: python3 scripts/gitleaks_scope_canary.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: secret-scan
          cache-all-crates: "false"

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The arch-gates job has no gitleaks, so this test skips its scan there.
      # Here gitleaks is installed, and REQUIRE_GITLEAKS makes a skip a failure.
      - name: Gitleaks — architecture gate with gitleaks required
        env:
          REQUIRE_GITLEAKS: "1"
        run: cargo test --locked -p rvc-architecture-tests --test gitleaks_allow_scope

      # Gate 2b: emit a representative trace-level log sample through the redaction primitives,
      # then defend it two ways — (i) gitleaks over the emitted output catches a raw hex
      # pubkey/root/key regression; (ii) an explicit content assertion catches ANY raw-secret
      # regression, including a low-entropy password that gitleaks cannot detect. Fail closed.
      - name: Emit a trace-level log sample via the redaction primitives
        run: |
          set -euo pipefail
          mkdir -p emitted-sample
          cargo run -q -p rvc-crypto --example log_sample > emitted-sample/emitted-trace.log
          test -s emitted-sample/emitted-trace.log

      - name: Gitleaks — emitted trace-level log sample
        run: gitleaks detect --no-git --source emitted-sample --config "$RVC_GITLEAKS_EMITTED_CONFIG" --redact --no-banner --exit-code 1

      - name: Assert redaction on the emitted sample (raw absent, redacted present)
        run: |
          log=emitted-sample/emitted-trace.log
          fail=0
          absent()  { if grep -qF -- "$1" "$log"; then echo "REGRESSION: raw $2 present in emitted log"; fail=1; fi; }
          present() { if ! grep -qF -- "$1" "$log"; then echo "REGRESSION: redacted $2 missing from emitted log"; fail=1; fi; }
          # Raw secret-shaped inputs MUST NOT appear verbatim (gitleaks cannot see the password):
          absent "93247f2209abcacf57b75a51dafae777f9dd38bc7053d1af526f220a7489a6d3a2753e5f3e8b1cfe39b56f43611df74a" "pubkey hex"
          absent "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f" "root hex"
          absent "hunter2pw" "URL password"
          # Redacted/truncated forms MUST appear (proves the wrappers actually ran):
          present "0x93247f2209...611df74a" "pubkey"
          present "0x0001020304...1c1d1e1f" "root"
          present "***:***@beacon.example.com" "URL"
          exit "$fail"

  coverage:
    name: Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage
          cache-all-crates: "false"

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest

      - name: Generate coverage report
        run: cargo llvm-cov nextest --locked --workspace --lcov --output-path lcov.info

      - name: Generate coverage summary
        id: coverage
        run: |
          cargo llvm-cov report --json > coverage.json

          COVERAGE=$(jq '.data[0].totals.lines.percent' coverage.json)
          COVERED=$(jq '.data[0].totals.lines.covered' coverage.json)
          TOTAL=$(jq '.data[0].totals.lines.count' coverage.json)
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"

          {
            echo "## Coverage Report"
            echo ""
            printf "**Total: %.2f%%** (%d / %d lines)\n" "$COVERAGE" "$COVERED" "$TOTAL"
            echo ""
            echo "| File | Coverage | Lines |"
            echo "|------|----------|-------|"
            jq -r '.data[0].files[] | select(.summary.lines.count > 0) | "\(.filename | split("/") | .[-2:] | join("/"))|\(.summary.lines.percent)|\(.summary.lines.covered)/\(.summary.lines.count)"' coverage.json | \
              while IFS='|' read -r file pct lines; do
                printf "| \`%s\` | %.1f%% | %s |\n" "$file" "$pct" "$lines"
              done
          } > coverage-summary.md

      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: coverage
          path: coverage-summary.md

  arch-gates:
    name: Architecture Gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: arch-gates
          cache-all-crates: "false"

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest

      # G-3 (`tests/env_allowlist.rs`: env allow-list + figment absence) is in this package.
      - name: Run architecture tests
        run: cargo nextest run -p rvc-architecture-tests

      # ARCH-7j / M5: enumeration gate under `--features dvt`.
      # protoc is already installed above (signer-proto build.rs).
      # Clippy `--features dvt` stays on the check job (Gate 1 secret-sink);
      # this step is the test run those cfg(dvt) gates need.
      # `--final-status-level pass` lists passed names so a vacuous empty
      # feature-gated suite cannot hide in a green summary.
      - name: Run signer-server DVT enumeration gate
        run: cargo nextest run -p rvc-signer-server --features dvt --final-status-level pass

      # 7.5: Gloas boundary suite + rvc-bin Gloas-head smoke. Whole packages
      # (a fork_transition filter would drop the binary smoke). Non-skippable.
      # Run even if architecture-tests is red (unrelated class-1 inventory debt
      # must not hide this gate).
      - name: Run fork-transition gate
        if: ${{ !cancelled() }}
        run: make test-fork-transition

  # REQUIRED is job-local: coverage runs --workspace without fetching vectors
  # and must keep skipping (3.3b). A top-level env would turn that skip into RED.
  spec-vectors:
    name: Spec Vectors
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      RVC_SPEC_VECTORS_REQUIRED: "1"
      PRESET: minimal
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: spec-vectors
          cache-all-crates: "false"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest

      # Archives only: the pin is the tarball digest, not a restored tests/ tree.
      # No restore-keys: a lock change must miss, not restore a stale archive.
      - name: Cache spec-vector archives
        id: spec-vector-cache
        uses: actions/cache@v4
        with:
          path: crates/rvc-spec-vectors/vectors/**/*.tar.gz
          key: ${{ runner.os }}-spec-vectors-${{ hashFiles('crates/rvc-spec-vectors/vectors.lock') }}

      - name: Report spec-vector cache
        run: echo "spec-vector cache-hit=${{ steps.spec-vector-cache.outputs.cache-hit }}"

      - name: Fetch spec vectors
        run: make spec-vectors

      # 3.4b pyspec artifact is checked in; this step is sha256-only (no Python).
      # Regeneration is 3.10b nightly.
      - name: Verify generated vector digest
        run: make spec-vectors-verify

      - name: Run spec-vector suites
        run: cargo nextest run -p rvc-spec-vectors --locked --final-status-level pass

  # P1-A5 / issue 1.6: no Rust toolchain. Issue 6.5 widens pytest to
  # scripts/tests/ (validator_perf + attach + devnet). No cargo, no live job.
  scripts:
    name: Scripts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          checksum: "745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd"

      - name: Shellcheck
        run: shellcheck scripts/devnet/*.sh scripts/devnet/lib/common.sh

      - name: Pytest (scripts)
        run: uv run --with pytest==9.1.1 --with pytest-socket==0.8.1 --with pyyaml==6.0.3 pytest scripts/tests/ -q

  # TRC-5d / #435. First docker compose job on the PR lane. Not a required check.
  # 30 minutes covers a cold debug build of bin/rvc and bin/rvc-signer plus the
  # script's own slot waits. A hung fixture dies here, not at the runner default.
  trace-e2e:
    name: Trace continuity (end to end)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OTEL_TRACES_SAMPLER_ARG: "1.0"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: trace-e2e
          cache-all-crates: "false"

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Host bins. Part 2 resolves target/debug/rvc and target/debug/rvc-signer
      # (or RVC_BIN / RVC_SIGNER_BIN). OTLP stays the script default, loopback.
      - name: Build host bins
        run: cargo build --locked -p rvc-bin -p rvc-signer-bin

      - name: Trace e2e part 1 (fixture beacon node)
        run: scripts/trace-e2e.sh --part 1

      - name: Trace e2e part 2 (host bins, Jaeger, SIGTERM)
        run: scripts/trace-e2e.sh --part 2

      - name: Assert trace continuity
        run: scripts/assert-trace-continuity.sh target/trace-e2e/spans.json

      # Missing spans on an early fail must not fail this step.
      - name: Upload spans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-e2e-spans
          path: target/trace-e2e/spans.json
          if-no-files-found: ignore
          retention-days: 7
