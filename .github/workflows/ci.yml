name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run clippy (dvt feature — Gate 1 secret-sink coverage)
        run: cargo clippy -p rvc-signer-bin --all-targets --features dvt -- -D warnings

      # Dependency hygiene (SEC-10): fail closed on unignored RustSec advisories.
      # Policy ignores for known-blocked transitive crates live in `.cargo/audit.toml`.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit

      # Unused declared deps (ARCH-P2-6 / ARCH-5). cargo-udeps is not adopted:
      # it needs nightly; CI pins dtolnay/rust-toolchain@stable (A-E3).
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Run cargo machete
        run: cargo machete

      # 3.9b + 5.15 / #290: graph assertion on a real libssz consumer.
      # Not blanket `cargo tree -d` emptiness — ethereum_ssz 0.9 + 0.8.3 is an
      # intentional existing dual (workspace `ssz` / `ssz08`).
      # `cargo tree -d` alone is not enough: ruint's primitive-types 0.12.2 is
      # lock-resident but not tree-linked, so enabling libssz-merkle's
      # `ethereum_types` feature adds ethereum-types + primitive-types 0.13
      # without a -d duplicate. Also scan Cargo.lock / invert-tree.
      # 5.15: no ethereum-types, exactly one primitive-types (island stack purity).
      - name: Assert no ethereum-types / single primitive-types
        run: |
          set -euo pipefail
          # Non-vacuity: 3.7 put libssz in Cargo.lock; an empty match would
          # make the graph grep succeed without a consumer.
          if ! grep -q libssz Cargo.lock; then
            echo "libssz missing from Cargo.lock — cargo tree -d assertion would be vacuous"
            exit 1
          fi
          echo "=== Cargo.lock libssz ==="
          grep -n libssz Cargo.lock
          echo "=== resolved libssz-merkle ==="
          # CARGO_TERM_COLOR=always would inject ANSI into package lines.
          tree=$(CARGO_TERM_COLOR=never cargo tree --locked --workspace --color never -i libssz-merkle)
          printf '%s\n' "$tree"
          resolved=$(printf '%s\n' "$tree" | sed -n 's/^libssz-merkle v\([0-9][0-9.]*\).*/libssz-merkle \1/p' | head -n 1)
          if [ "$resolved" != "libssz-merkle 0.3.0" ]; then
            echo "libssz-merkle 0.3.0 missing from resolved graph (got: ${resolved:-none})"
            exit 1
          fi
          echo "$resolved"
          echo "=== cargo tree -d --workspace ==="
          dups=$(CARGO_TERM_COLOR=never cargo tree --locked -d --workspace --color never)
          printf '%s\n' "$dups"
          fail=0
          if printf '%s\n' "$dups" | grep -F -- 'ethereum-types'; then
            echo "REGRESSION: ethereum-types present in cargo tree -d --workspace"
            fail=1
          fi
          # Duplicate roots are unindented "name vversion".
          pt_d=$(printf '%s\n' "$dups" | sed -n 's/^primitive-types v\([^ ]*\).*/\1/p' | sort -u | grep -c . || true)
          if [ "$pt_d" -ge 2 ]; then
            echo "REGRESSION: second primitive-types in cargo tree -d ($pt_d versions)"
            fail=1
          fi
          # Invert-tree: unique ethereum-types never appears in -d.
          if et_tree=$(CARGO_TERM_COLOR=never cargo tree --locked --workspace --color never -i ethereum-types --depth 0 2>/dev/null); then
            echo "REGRESSION: ethereum-types entered the resolved graph:"
            printf '%s\n' "$et_tree"
            fail=1
          fi
          pt_lock=$(grep -c '^name = "primitive-types"' Cargo.lock || true)
          echo "Cargo.lock primitive-types packages: $pt_lock"
          if [ "$pt_lock" -ne 1 ]; then
            echo "REGRESSION: expected exactly one primitive-types in Cargo.lock, found $pt_lock"
            awk '/^name = "primitive-types"$/{print; getline; print}' Cargo.lock
            fail=1
          fi
          if grep -q '^name = "ethereum-types"' Cargo.lock; then
            echo "REGRESSION: ethereum-types entered Cargo.lock"
            fail=1
          fi
          exit "$fail"

      # 5.15 / #290: island build/test against Cargo.lock (no silent dep float).
      - name: Build rvc-gloas
        run: cargo build -p rvc-gloas --locked

      - name: Test rvc-gloas
        run: cargo test -p rvc-gloas --locked --all-targets

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          GITLEAKS_SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz
          gitleaks version

      # Gate 2a: scan the source tree (working files); fail closed on any finding.
      - name: Gitleaks — source tree
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-secretscan-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-secretscan-

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Gate 2b: emit a representative trace-level log sample through the redaction primitives,
      # then defend it two ways — (i) gitleaks over the emitted output catches a raw hex
      # pubkey/root/key regression; (ii) an explicit content assertion catches ANY raw-secret
      # regression, including a low-entropy password that gitleaks cannot detect. Fail closed.
      - name: Emit a trace-level log sample via the redaction primitives
        run: |
          set -euo pipefail
          mkdir -p emitted-sample
          cargo run -q -p rvc-crypto --example log_sample > emitted-sample/emitted-trace.log
          test -s emitted-sample/emitted-trace.log

      - name: Gitleaks — emitted trace-level log sample
        run: gitleaks detect --no-git --source emitted-sample --config .gitleaks-emitted.toml --redact --no-banner --exit-code 1

      - name: Assert redaction on the emitted sample (raw absent, redacted present)
        run: |
          log=emitted-sample/emitted-trace.log
          fail=0
          absent()  { if grep -qF -- "$1" "$log"; then echo "REGRESSION: raw $2 present in emitted log"; fail=1; fi; }
          present() { if ! grep -qF -- "$1" "$log"; then echo "REGRESSION: redacted $2 missing from emitted log"; fail=1; fi; }
          # Raw secret-shaped inputs MUST NOT appear verbatim (gitleaks cannot see the password):
          absent "93247f2209abcacf57b75a51dafae777f9dd38bc7053d1af526f220a7489a6d3a2753e5f3e8b1cfe39b56f43611df74a" "pubkey hex"
          absent "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f" "root hex"
          absent "hunter2pw" "URL password"
          # Redacted/truncated forms MUST appear (proves the wrappers actually ran):
          present "0x93247f2209...611df74a" "pubkey"
          present "0x0001020304...1c1d1e1f" "root"
          present "***:***@beacon.example.com" "URL"
          exit "$fail"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Generate coverage report
        run: cargo llvm-cov nextest --locked --workspace --lcov --output-path lcov.info

      - name: Generate coverage summary
        id: coverage
        run: |
          cargo llvm-cov report --json > coverage.json

          COVERAGE=$(jq '.data[0].totals.lines.percent' coverage.json)
          COVERED=$(jq '.data[0].totals.lines.covered' coverage.json)
          TOTAL=$(jq '.data[0].totals.lines.count' coverage.json)
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

          {
            echo "## Coverage Report"
            echo ""
            printf "**Total: %.2f%%** (%d / %d lines)\n" "$COVERAGE" "$COVERED" "$TOTAL"
            echo ""
            echo "| File | Coverage | Lines |"
            echo "|------|----------|-------|"
            jq -r '.data[0].files[] | select(.summary.lines.count > 0) | "\(.filename | split("/") | .[-2:] | join("/"))|\(.summary.lines.percent)|\(.summary.lines.covered)/\(.summary.lines.count)"' coverage.json | \
              while IFS='|' read -r file pct lines; do
                printf "| \`%s\` | %.1f%% | %s |\n" "$file" "$pct" "$lines"
              done
          } > coverage-summary.md

      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage-summary.md

  arch-gates:
    name: Architecture Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-arch-gates-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-arch-gates-

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # G-3 (`tests/env_allowlist.rs`: env allow-list + figment absence) is in this package.
      - name: Run architecture tests
        run: cargo nextest run -p rvc-architecture-tests

      # ARCH-7j / M5: enumeration gate under `--features dvt`.
      # protoc is already installed above (signer-proto build.rs).
      # Clippy `--features dvt` stays on the check job (Gate 1 secret-sink);
      # this step is the test run those cfg(dvt) gates need.
      # `--final-status-level pass` lists passed names so a vacuous empty
      # feature-gated suite cannot hide in a green summary.
      - name: Run signer-server DVT enumeration gate
        run: cargo nextest run -p rvc-signer-server --features dvt --final-status-level pass

  # REQUIRED is job-local: coverage runs --workspace without fetching vectors
  # and must keep skipping (3.3b). A top-level env would turn that skip into RED.
  spec-vectors:
    name: Spec Vectors
    runs-on: ubuntu-latest
    env:
      RVC_SPEC_VECTORS_REQUIRED: "1"
      PRESET: minimal
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-spec-vectors-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-spec-vectors-deps-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Archives only: the pin is the tarball digest, not a restored tests/ tree.
      # No restore-keys: a lock change must miss, not restore a stale archive.
      - name: Cache spec-vector archives
        id: spec-vector-cache
        uses: actions/cache@v4
        with:
          path: crates/rvc-spec-vectors/vectors/**/*.tar.gz
          key: ${{ runner.os }}-spec-vectors-${{ hashFiles('crates/rvc-spec-vectors/vectors.lock') }}

      - name: Report spec-vector cache
        run: echo "spec-vector cache-hit=${{ steps.spec-vector-cache.outputs.cache-hit }}"

      - name: Fetch spec vectors
        run: make spec-vectors

      # 3.4b pyspec artifact is checked in; this step is sha256-only (no Python).
      # Regeneration is 3.10b nightly.
      - name: Verify generated vector digest
        run: make spec-vectors-verify

      - name: Run spec-vector suites
        run: cargo nextest run -p rvc-spec-vectors --locked --final-status-level pass
