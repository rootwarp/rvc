name: Devnet (nightly)

on:
  schedule:
    # 02:00 UTC daily. GitHub only fires `schedule` on the default branch.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "run.sh --profile (safe is the nightly default)"
        type: choice
        default: safe
        options:
          - safe
          - fast
      epochs:
        description: "run.sh --epochs (overrides the profile default)"
        type: string
        default: "8"

# One unattended soak at a time. A new dispatch cancels an in-flight run.
concurrency:
  group: devnet-nightly
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: check
          cache-all-crates: "false"

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Package for bin/rvc. A bare --release builds every workspace crate.
      - name: Build rvc
        run: cargo build --release --locked -p rvc-bin

      # upload-artifact@v4 strips common leading directories, so the
      # artifact contains the file "rvc" (not target/release/rvc).
      - name: Upload rvc
        uses: actions/upload-artifact@v4
        with:
          name: rvc-bin
          path: target/release/rvc
          if-no-files-found: error

  soak:
    name: Soak
    needs: build
    runs-on: ubuntu-latest
    # P6-A3: 83.2 min chain (P6-A2: offset 3 + sample 8 + clamp 2 = head epoch 13
    # × 32 slots × 12 s) + ~10 min pulls/genesis/attach/report + margin.
    # Architecture's 75 predates P6-A2; build is a separate 60-minute job.
    timeout-minutes: 110
    env:
      PROFILE: ${{ github.event.inputs.profile || 'safe' }}
      EPOCHS: ${{ github.event.inputs.epochs || '8' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Place the file at the path run.sh invokes (repo-root target/release/rvc).
      - name: Download rvc
        uses: actions/download-artifact@v4
        with:
          name: rvc-bin
          path: target/release

      # Mode bits do not survive the artifact round trip.
      - name: Make rvc executable
        run: chmod +x target/release/rvc

      # Mint RUN_ID=${GITHUB_RUN_ID} (ADR-012) so the upload path is one
      # scripts/devnet/runs/<id>/. Orchestrator exit ≠ 0 fails this step.
      - name: Soak
        run: |
          set -euo pipefail
          RUN_ID="${GITHUB_RUN_ID}"
          scripts/devnet/run.sh --profile "${PROFILE}" --epochs "${EPOCHS}" --run-id "${RUN_ID}"

      - name: Upload run dir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devnet-run-${{ github.run_id }}
          path: scripts/devnet/runs/${{ github.run_id }}
          include-hidden-files: true
          retention-days: 7

      - name: Teardown
        if: always()
        run: scripts/devnet/down.sh --data
